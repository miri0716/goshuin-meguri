<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263e35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"><title>御朱印めぐり</title><style>
:root{--ink:#253a31;--muted:#77796e;--paper:#f7f4eb;--red:#a94f3f;--line:#e6dfd1}*{box-sizing:border-box}body{margin:0;background:#e9e7dc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;background:var(--paper);padding-bottom:100px}.hero{background:#263e35;color:#f8f4e9;padding:36px 22px 23px;position:relative;overflow:hidden}.hero:after{content:'⛩';position:absolute;font-size:140px;opacity:.075;right:-12px;top:12px}.eyebrow{font-size:11px;letter-spacing:.25em;color:#d5c5a5}.hero h1{font-family:serif;font-weight:500;letter-spacing:.12em;font-size:32px;margin:10px 0}.hero p{font-size:12px;color:#ddd9cc;margin:0}.stats{display:flex;gap:10px;margin:18px 18px 12px}.stat{flex:1;background:#fffdf8;border:1px solid var(--line);border-radius:12px;text-align:center;padding:13px 6px}.stat strong{display:block;font-size:23px;font-family:Georgia,serif}.stat span{font-size:11px;color:var(--muted)}.toolbar{padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap}.pill{background:#fffdf8;border:1px solid #d9d2c4;border-radius:30px;padding:10px 13px;color:var(--ink);font-size:12px}.pill.active{background:var(--ink);color:white}.section{padding:5px 18px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}.section-title h2{font-size:17px;font-weight:600;letter-spacing:.09em;margin:0}.section-title small{font-size:11px;color:var(--muted)}.shrine{background:#fffdf8;border:1px solid var(--line);border-radius:16px;margin-bottom:13px;overflow:hidden;box-shadow:0 3px 14px #3b302008}.photo{height:164px;position:relative;background:linear-gradient(145deg,#c5c7b0,#7b8e79 65%,#4c695d);display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo .placeholder{font-size:62px;opacity:.65;filter:grayscale(.2)}.photo .num{position:absolute;left:12px;top:12px;background:#f9f5e9eb;border-radius:5px;padding:5px 9px;font-size:11px;font-weight:700}.photo .photoLink{position:absolute;right:10px;bottom:10px;background:#fffdf0ed;color:var(--ink);border:0;border-radius:20px;padding:8px 12px;font-size:12px}.content{padding:15px}.nameRow{display:flex;justify-content:space-between;gap:12px;align-items:start}.name{font-size:20px;font-family:serif;font-weight:600;letter-spacing:.03em}.address{font-size:11px;color:var(--muted);margin:7px 0}.tag{display:inline-block;font-size:11px;border:1px solid #cfba9b;border-radius:4px;padding:4px 7px;margin-top:7px;color:#8b6545}.tag.ok{color:#316650;border-color:#8aab95}.details{display:flex;justify-content:space-between;gap:8px;margin:13px 0;color:#5b6358;font-size:12px}.actions{display:flex;gap:7px}.actions button,.actions a{flex:1;border-radius:9px;border:1px solid #d6d5c9;background:#f8f7f0;padding:11px 4px;text-align:center;text-decoration:none;color:var(--ink);font-size:12px}.actions .go{background:var(--ink);color:white;border-color:var(--ink)}.visit{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}.visit input{accent-color:#557660;width:19px;height:19px}.visited .photo{filter:saturate(.65)}.visited .name{opacity:.65}.notice{font-size:12px;color:#736e60;line-height:1.8;background:#eee8dc;border-radius:10px;padding:12px;margin:5px 18px 18px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;display:flex;background:#fffdf9;border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom));gap:10px;z-index:10}.bottom button{flex:1;border:0;border-radius:11px;padding:13px;background:#263e35;color:#fff}.bottom button.secondary{background:#ede9dd;color:#263e35}.modal{position:fixed;inset:0;background:#172820a8;display:none;align-items:end;justify-content:center;z-index:30}.modal.open{display:flex}.sheet{background:#faf7ef;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 15px;font-size:21px;font-family:serif}.field{display:block;margin:12px 0;font-size:12px}.field input,.field select{display:block;width:100%;border:1px solid #d8d0c1;border-radius:9px;padding:12px;background:white;margin-top:6px;color:var(--ink)}.primary{background:#263e35;color:white;border:0;border-radius:9px;padding:13px;width:100%;margin-top:10px}.close{float:right;border:0;background:none;font-size:23px;color:var(--ink)}.result{padding:12px;border-bottom:1px solid var(--line);font-size:13px}.result button{float:right;border:0;background:#263e35;color:white;border-radius:7px;padding:6px 10px}.small{font-size:11px;color:#756e62;line-height:1.7}.empty{text-align:center;padding:40px;color:var(--muted)}
</style></head><body><main class="app"><header class="hero"><div class="eyebrow">神社を訪ね、印を集める</div><h1>御朱印めぐり <span style="font-size:18px">⛩</span></h1><p>次に訪ねたい神社が、きっと見つかる。</p></header><div class="stats"><div class="stat"><strong id="total">10</strong><span>登録神社</span></div><div class="stat"><strong id="done">0</strong><span>参拝済み</span></div><div class="stat"><strong id="left">10</strong><span>これから</span></div></div><div class="toolbar"><button class="pill active" id="allBtn" onclick="setFilter('all')">すべて</button><button class="pill" id="todoBtn" onclick="setFilter('todo')">未訪問</button><button class="pill" id="doneBtn" onclick="setFilter('done')">参拝済み</button><button class="pill" onclick="useGPS()">⌖ 現在地順</button><button class="pill" onclick="useHome()">⌂ 自宅周辺順</button><button class="pill" onclick="exportData()">↧ 記録を保存</button><button class="pill" onclick="document.getElementById('importFile').click()">↥ 復元</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div><section class="section"><div class="section-title"><h2>神社の一覧</h2><small id="sortLabel">池上新町付近・暫定順</small></div><div id="list"></div></section><div class="notice">※ 距離は位置情報が取得できた場合のみ直線距離で表示します。御朱印の直書きや受付時間は変更されることがあります。参拝前に公式情報をご確認ください。写真はWikipediaから取得できた場合のみ表示します。</div><nav class="bottom"><button class="secondary" onclick="openModal('add')">＋ 手動で追加</button><button onclick="openModal('search')">⌕ 範囲を広げて探す</button></nav></main>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>
const defaults=[
['若宮八幡宮','神奈川県川崎市川崎区大師駅前2-13-16','9:00〜17:00','直書き案内あり','若宮八幡宮 (川崎市)'],
['金山神社','神奈川県川崎市川崎区大師駅前2-13-16','要確認','直書き未確認','金山神社 (川崎市)'],
['稲毛神社','神奈川県川崎市川崎区宮本町7-7','9:00〜17:00','手書き案内あり','稲毛神社'],
['六郷神社','東京都大田区東六郷3-10-18','要確認','直書き未確認','六郷神社'],
['羽田神社','東京都大田区本羽田3-9-12','9:30〜16:30（参考）','直書き未確認','羽田神社'],
['穴守稲荷神社','東京都大田区羽田5-2-7','8:30〜17:00','期間限定の直書き実績','穴守稲荷神社'],
['蒲田八幡神社','東京都大田区蒲田4-18-18','10:00〜15:00（参考）','直書き案内あり','蒲田八幡神社'],
['鶴見神社','神奈川県横浜市鶴見区鶴見中央1-14-1','要確認','直書き未確認','鶴見神社'],
['磐井神社','東京都大田区大森北2-20-8','要確認','直書き未確認','磐井神社'],
['大師稲荷神社','神奈川県川崎市川崎区中瀬3-5-12','要確認','御朱印授与も要確認','大師稲荷神社']
].map((a,i)=>({id:'base'+i,name:a[0],address:a[1],hours:a[2],status:a[3],wiki:a[4],visited:false}));
const key='goshuin-meguri-v1';let shrines;try{shrines=JSON.parse(localStorage.getItem(key))||defaults}catch{shrines=defaults}let filter='all',locationPoint=null,images={};const save=()=>localStorage.setItem(key,JSON.stringify(shrines));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const maps=(s,dir=false)=>'https://www.google.com/maps/'+(dir?'dir/?api=1&destination=':'search/?api=1&query=')+encodeURIComponent(s.address||s.name);const photos=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' '+s.address);function km(a,b){const r=Math.PI/180,dlat=(a.lat-b.lat)*r,dlon=(a.lon-b.lon)*r,x=Math.sin(dlat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dlon/2)**2;return 12742*Math.asin(Math.sqrt(x))}function ordered(){return [...shrines].sort((a,b)=>locationPoint?(a.lat&&a.lon?km(locationPoint,a):1e6)-(b.lat&&b.lon?km(locationPoint,b):1e6):defaults.findIndex(x=>x.id===a.id)<0?1:defaults.findIndex(x=>x.id===b.id)<0?-1:defaults.findIndex(x=>x.id===a.id)-defaults.findIndex(x=>x.id===b.id))}function render(){document.getElementById('total').textContent=shrines.length;const d=shrines.filter(x=>x.visited).length;document.getElementById('done').textContent=d;document.getElementById('left').textContent=shrines.length-d;['all','todo','done'].forEach(k=>document.getElementById(k+'Btn').classList.toggle('active',filter===k));let data=ordered().filter(s=>filter==='all'||(filter==='done'?s.visited:!s.visited));document.getElementById('list').innerHTML=data.length?data.map((s,i)=>`<article class="shrine ${s.visited?'visited':''}"><div class="photo">${images[s.id]?`<img loading="lazy" src="${esc(images[s.id])}" alt="${esc(s.name)}の写真">`:'<span class="placeholder">⛩</span>'}<span class="num">${String(i+1).padStart(2,'0')}</span><button class="photoLink" onclick="openPhotos('${s.id}')">写真を見る ↗</button></div><div class="content"><div class="nameRow"><div><div class="name">${esc(s.name)}</div><div class="address">${esc(s.address)}</div><span class="tag ${/案内あり/.test(s.status)?'ok':''}">${esc(s.status)}</span></div><label class="visit"><input type="checkbox" ${s.visited?'checked':''} onchange="toggle('${s.id}',this.checked)">参拝済</label></div><div class="details"><span>🕘 ${esc(s.hours)}</span><span>${locationPoint&&s.lat&&s.lon?km(locationPoint,s).toFixed(1)+' km（直線）':'距離未計測'}</span></div><div class="actions"><a target="_blank" rel="noopener" href="${maps(s)}">地図</a><a class="go" target="_blank" rel="noopener" href="${maps(s,true)}">➤ 道案内</a><button onclick="editShrine('${s.id}')">編集</button></div></div></article>`).join(''):'<div class="empty">該当する神社はありません</div>';data.forEach(s=>loadPhoto(s))}function openPhotos(id){const s=shrines.find(x=>x.id===id);if(s)window.open(photos(s),'_blank','noopener')}function toggle(id,v){let s=shrines.find(x=>x.id===id);if(s){s.visited=v;save();render()}}function setFilter(v){filter=v;render()}function openModal(type){document.getElementById('modal').classList.add('open');document.getElementById('modalBody').innerHTML=type==='add'?addForm():searchForm()}function closeModal(){document.getElementById('modal').classList.remove('open')}function addForm(s={}){return `<h2>${s.id?'神社を編集':'神社を追加'}</h2><form onsubmit="submitShrine(event,'${s.id||''}')"><label class="field">神社名<input name="name" required value="${esc(s.name||'')}"></label><label class="field">住所<input name="address" required value="${esc(s.address||'')}"></label><label class="field">御朱印受付時間<input name="hours" value="${esc(s.hours||'要確認')}"></label><label class="field">直書き情報<select name="status">${['直書き未確認','直書き案内あり','手書き案内あり','期間限定の直書き実績','御朱印授与も要確認'].map(v=>`<option ${s.status===v?'selected':''}>${v}</option>`).join('')}</select></label><button class="primary">保存する</button>${s.id&&!s.id.startsWith('base')?`<button type="button" class="primary" style="background:#aa5547" onclick="removeShrine('${s.id}')">削除</button>`:''}</form>`}function editShrine(id){const s=shrines.find(x=>x.id===id);if(s){openModal('add');document.getElementById('modalBody').innerHTML=addForm(s)}}function submitShrine(e,id){e.preventDefault();const f=new FormData(e.target),s={id:id||'custom'+Date.now(),name:f.get('name').trim(),address:f.get('address').trim(),hours:f.get('hours'),status:f.get('status'),visited:shrines.find(x=>x.id===id)?.visited||false};if(id){Object.assign(shrines.find(x=>x.id===id),s)}else shrines.push(s);save();closeModal();render();geocode(s)}function removeShrine(id){if(confirm('この神社を削除しますか？')){shrines=shrines.filter(s=>s.id!==id);save();closeModal();render()}}
async function loadPhoto(s){if(images[s.id]!==undefined||!s.wiki)return;images[s.id]='';try{const url='https://ja.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=900&titles='+encodeURIComponent(s.wiki)+'&origin=*';const j=await(await fetch(url)).json();const p=Object.values(j.query.pages)[0];if(p.thumbnail?.source){images[s.id]=p.thumbnail.source;render()}}catch{}}
async function geocode(s){if(s.lat&&s.lon)return;try{const q=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(s.address));const j=await q.json();if(j[0]){s.lat=+j[0].lat;s.lon=+j[0].lon;save();render()}}catch{}}
function useHome(){locationPoint=null;document.getElementById('sortLabel').textContent='池上新町付近・暫定順';render()}function useGPS(){if(!navigator.geolocation){alert('この環境では位置情報を利用できません');return}navigator.geolocation.getCurrentPosition(async p=>{locationPoint={lat:p.coords.latitude,lon:p.coords.longitude};document.getElementById('sortLabel').textContent='現在地から直線距離順';render();await Promise.all(shrines.map(geocode));render()},()=>alert('位置情報を取得できません。Safariの位置情報の許可を確認してください。'),{enableHighAccuracy:false,timeout:12000})}
function exportData(){const blob=new Blob([JSON.stringify({version:1,shrines},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='goshuin-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.shrines)||obj.shrines.length>2000||!obj.shrines.every(x=>typeof x.name==='string'&&typeof x.address==='string'))throw Error('形式が違います');if(!confirm('現在の参拝記録をバックアップの内容に置き換えますか？'))return;shrines=obj.shrines;save();render();alert('復元しました')}catch{alert('読み込めませんでした。正しいバックアップを選んでください')}finally{e.target.value=''}}function searchForm(){return `<h2>近くの神社を探す</h2><p class="small">OpenStreetMapの登録データから神社を検索します。検索結果は御朱印・直書き対応を保証しません。追加後に必ず確認してください。</p><label class="field">検索の中心<input id="center" value="川崎市川崎区池上新町"></label><label class="field">検索半径<select id="radius"><option value="3000">3 km</option><option value="5000" selected>5 km</option><option value="10000">10 km</option><option value="20000">20 km</option></select></label><button class="primary" onclick="searchShrines()">検索する</button><div id="results" class="small"></div>`}async function searchShrines(){const out=document.getElementById('results');out.textContent='検索しています…';try{const place=document.getElementById('center').value;const radius=+document.getElementById('radius').value;const g=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(place))).json();if(!g.length)throw Error('中心地点が見つかりません');const lat=+g[0].lat,lon=+g[0].lon;const query=`[out:json][timeout:25];(nwr(around:${radius},${lat},${lon})["religion"="shinto"]["name"];);out center 100;`;const response=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:query})});if(!response.ok)throw Error('検索サービスが応答しません');const data=await response.json();const results=data.elements.map(x=>({name:x.tags?.['name:ja']||x.tags?.name,lat:x.lat||x.center?.lat,lon:x.lon||x.center?.lon})).filter(x=>x.name&&x.lat&&x.lon&&!shrines.some(s=>s.name===x.name)).sort((a,b)=>km({lat,lon},a)-km({lat,lon},b)).slice(0,35);window.searchResults=results;out.innerHTML=results.length?`<p>${results.length}件見つかりました（御朱印対応は未確認）</p>`+results.map((s,i)=>`<div class="result"><button onclick="addFound(${i})">追加</button><b>${esc(s.name)}</b><br>${km({lat,lon},s).toFixed(1)} km（直線）</div>`).join(''):'追加候補が見つかりませんでした'}catch(e){out.textContent='検索できませんでした。通信状況や検索サービスの混雑を確認してください。 '+e.message}}
function addFound(i){const s=window.searchResults[i];if(!s)return;shrines.push({id:'found'+Date.now(),name:s.name,address:s.name+'（住所未確認）',lat:s.lat,lon:s.lon,hours:'要確認',status:'御朱印授与も要確認',visited:false});save();render();alert(s.name+' を追加しました。御朱印対応は未確認です。')}
render();
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
