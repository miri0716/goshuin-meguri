].map((a,i)=>({id:'base'+i,name:a[0],address:a[1],hours:a[2],status:a[3],wiki:a[4],visited:false}));
// Verified contact numbers; never overwrite user-edited phone numbers.
const verified={base0:{phone:'044-222-3206',phoneSource:'https://www.kanagawa-jinja.or.jp/shrine/1201005-000/'},base2:{phone:'044-222-4554',phoneSource:'https://www.takemikatsuchi.net/toiawase_f/'},base5:{phone:'03-3741-0809',phoneSource:'https://www.anamori.jp/inquiry.html'}};
// Versioned reference information, checked against Keikyu's published 2025 shrine guide.

const referenceKinds={

};

// v7: Reconcile legacy records by canonical shrine identity, not just old IDs.
// Preserve visits, user additions, phone edits and other personal data.
function shrineIdentity(s){
 const name=String(s.name||'').normalize('NFKC').replace(/[\s　]/g,'');
 const address=String(s.address||'').normalize('NFKC').replace(/[\s　－ー−‐]/g,'-');
 return {name,address};
}
function canonicalId(s){
 if(defaults.some(d=>d.id===s.id))return s.id;
 const x=shrineIdentity(s);
 const candidates=defaults.filter(d=>shrineIdentity(d).name===x.name);
 if(candidates.length!==1)return null;
 // Avoid assigning a common shrine name to an unrelated location.
 const a=shrineIdentity(candidates[0]).address;
 if(!x.address||!a||x.address===a||x.address.includes(a)||a.includes(x.address))return candidates[0].id;
 return null;
}
function migrateShrines(items){
 const existing=Array.isArray(items)?items.filter(x=>x&&typeof x==='object'):[];
 const seen=new Set();
 const migrated=existing.map(original=>{
  const s={...original};const id=canonicalId(s);
  if(id){seen.add(id);s.id=id;}
  const v=verified[id||s.id];
  if(v){if(!s.phone)s.phone=v.phone;if(!s.phoneSource)s.phoneSource=v.phoneSource;}
  const ref=referenceKinds[id||s.id];
  const valid=['direct','paper','both','unknown'].includes(s.kind);
  // The reference wins over legacy 'unknown' and any earlier automatic classification.
  // A deliberate user classification remains unchanged unless it was marked as automatic.
  const legacyUnknown=!valid||s.kind==='unknown';
  const oldReference=Number(s.referenceVersion||0)>0&&Number(s.referenceVersion||0)<ref?.referenceVersion;
  if(ref&&(legacyUnknown||oldReference)){
   s.kind=ref.kind;s.kindSource=ref.kindSource;s.kindNote=ref.kindNote;
   s.kindChecked=ref.kindChecked;s.referenceVersion=ref.referenceVersion;
   s.status='掲載資料では直書き・書き置き両方（当日要確認）';
  }else if(!valid)s.kind='unknown';

  return s;
 });
 // Repair missing built-in entries without erasing any custom shrines.
 for(const d of defaults){if(!seen.has(d.id))migrated.push({...d});}

}

let filter='all',sortMode='default',locationPoint=null,images={};const save=()=>localStorage.setItem(key,JSON.stringify(shrines));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const maps=(s,dir=false)=>'https://www.google.com/maps/'+(dir?'dir/?api=1&destination=':'search/?api=1&query=')+encodeURIComponent(s.address||s.name);const photos=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' '+s.address);function km(a,b){const r=Math.PI/180,dlat=(a.lat-b.lat)*r,dlon=(a.lon-b.lon)*r,x=Math.sin(dlat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dlon/2)**2;return 12742*Math.asin(Math.sqrt(x))}function ordered(){const baseIndex=s=>{const i=defaults.findIndex(x=>x.id===s.id);return i<0?1000:i};return [...shrines].sort((a,b)=>{if(sortMode==='default'||!locationPoint)return baseIndex(a)-baseIndex(b);const da=Number.isFinite(a.lat)&&Number.isFinite(a.lon)?km(locationPoint,a):Infinity,db=Number.isFinite(b.lat)&&Number.isFinite(b.lon)?km(locationPoint,b):Infinity;const knownA=Number.isFinite(da),knownB=Number.isFinite(db);if(knownA!==knownB)return knownA?-1:1;if(!knownA)return baseIndex(a)-baseIndex(b);return (sortMode==='far'?db-da:da-db)||baseIndex(a)-baseIndex(b)})}function setSortMode(v){sortMode=v;if(v==='default'){document.getElementById('sortLabel').textContent='登録順';render();return}if(!locationPoint){useGPS();return}document.getElementById('sortLabel').textContent=v==='far'?'現在地から遠い順':'現在地から近い順';render();loadMissingCoordinates()}

// A source excerpt can be classified locally. A URL alone is not proof of current service.
function classifyExcerpt(raw){
 const t=String(raw||'').replace(/\s+/g,'');
 if(!t)return {kind:'unknown',reason:'案内文がありません'};
 const direct=/(直書き|直接記帳|御朱印帳に(?:直接|お書き)|御朱印帳へ(?:直接|お書き)|帳面に(?:直接|お書き))/.test(t);
 const paper=/(書き置き|書置き|紙で(?:の)?(?:お渡し|授与)|紙朱印)/.test(t);
 const directNo=/(直書き(?:は|を)?(?:休止|中止|不可|対応しておりません|行っておりません)|記帳(?:は|を)?(?:休止|中止|不可))/.test(t);
 const paperOnly=/(書き置きのみ|書置きのみ|書き置きでの(?:み|対応)|書置きでの(?:み|対応))/.test(t);
 const paperNo=/(書き置き(?:は|を)?(?:休止|中止|不可|対応しておりません))/.test(t);
 if(paperOnly||directNo&&paper&&!paperNo)return {kind:'paper',reason:'書き置きの案内を検出'};
 if(directNo)return {kind:'unknown',reason:'直書き休止の記載があり、書き置き対応は確認できません'};
 if(direct&&paper&&!paperNo)return {kind:'both',reason:'両方の案内を検出'};
 if(direct&&!paperOnly)return {kind:'direct',reason:'直書きの案内を検出（書き置きの有無は未確認）'};
 if(paper&&!paperNo)return {kind:'paper',reason:'書き置きの案内を検出（直書きの有無は未確認）'};
 return {kind:'unknown',reason:'種類を特定できません'};
}

\//i.test(String(f.get('kindSource')||'').trim())?String(f.get('kindSource')).trim():'',sourceExcerpt:String(f.get('sourceExcerpt')||'').trim(),status:f.get('status'),phoneSource:shrines.find(x=>x.id===id)?.phoneSource||'',visited:shrines.find(x=>x.id===id)?.visited||false};if(s.sourceExcerpt){const classified=classifyExcerpt(s.sourceExcerpt);s.kind=classified.kind;s.status=classified.kind==='unknown'?'御朱印の種類は要確認':'案内文から分類（最新状況は要確認）'}if(id){Object.assign(shrines.find(x=>x.id===id),s)}else shrines.push(s);save();closeModal();render();geocode(s)}function removeShrine(id){if(confirm('この神社を削除しますか？')){shrines=shrines.filter(s=>s.id!==id);save();closeModal();render()}}

function exportData(){const blob=new Blob([JSON.stringify({version:1,shrines},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='goshuin-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.shrines)||obj.shrines.length>2000||!obj.shrines.every(x=>typeof x.name==='string'&&typeof x.address==='string'))throw Error('形式が違います');if(!confirm('現在の参拝記録をバックアップの内容に置き換えますか？'))return;shrines=migrateShrines(obj.shrines);save();render();alert('復元しました')}catch{alert('読み込めませんでした。正しいバックアップを選んでください')}finally{e.target.value=''}}// 全国の神社名・地名検索。検索結果は外部の地図データで、御朱印授与を保証しない。
function lookupForm(){return `<h2>神社を探して追加</h2><p class="small">正式名称でなくても検索できます。地名だけの検索にも対応。写真は対象の神社と紐付く画像がある場合のみ表示します。</p><label class="field">神社名・地名（どちらか入力）<input id="lookupQuery" type="search" enterkeyhint="search" placeholder="例：江ノ島神社・江の島・八幡神社" onkeydown="if(event.key==='Enter'){event.preventDefault();lookupShrines()}"></label><label class="field">地域（任意）<input id="lookupRegion" placeholder="例：神奈川県 鎌倉市" onkeydown="if(event.key==='Enter'){event.preventDefault();lookupShrines()}"></label><button class="primary" onclick="lookupShrines()">検索する</button><div id="lookupResults" aria-live="polite" class="small"></div><button class="primary" style="background:#687c68" onclick="openModal('add')">見つからない場合は手動で追加</button>`}
function normalizeShrineName(name){return String(name||'').normalize('NFKC').replace(/[\s　・]/g,'').toLowerCase()}
function existingMatch(candidate){return shrines.find(x=>{if(x.osmId&&candidate.osmId&&x.osmId===candidate.osmId)return true;if(normalizeShrineName(x.name)!==normalizeShrineName(candidate.name))return false;if(Number.isFinite(x.lat)&&Number.isFinite(x.lon)&&Number.isFinite(candidate.lat)&&Number.isFinite(candidate.lon))return km(x,candidate)<0.3;const ax=normalizeShrineName(x.address),bx=normalizeShrineName(candidate.address);return ax.length>5&&bx.length>5&&ax===bx})}

function lookupMap(x){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.lat+','+x.lon)}
function lookupCard(x,i){const found=existingMatch(x);const pic=x.photoUrl?`<img src="${esc(x.photoUrl)}" loading="lazy" alt="${esc(x.name)}に紐付く画像" onerror="this.remove()">`:'⛩';return `<article class="lookup-result"><div class="lookup-photo" id="lookupPhoto${i}">${pic}<span class="lookup-caption">${x.photoUrl?'関連画像':'写真未確認'}</span></div><div class="lookup-body"><div class="lookup-title">${esc(x.name)}</div><div class="lookup-region">📍 ${esc(x.region||'地域情報なし')}</div><div class="lookup-address">${esc(x.address)}</div><a class="lookup-map" href="${lookupMap(x)}" target="_blank" rel="noopener">地図で場所を確認 ↗</a>${x.osmId?`<div class="lookup-source">OpenStreetMap ID: ${esc(x.osmId)}</div>`:''}${found?`<div class="registered">✓ 登録済み：${found.visited?'参拝済み':'行きたい'}</div>`:`<div class="lookup-actions"><button onclick="addLookup(${i},false)">＋ 行きたい</button><button onclick="addLookup(${i},true)">✓ 参拝済み</button></div>`}</div></article>`}
// Search aliases are suggestions, not claims that names are officially equivalent.
const shrineAliases=[{terms:['江ノ島','江の島','江島','えのしま','エノシマ'],canonical:'江島',place:'江の島 神奈川県藤沢市',hint:'「江ノ島」「江の島」「江島」の表記をまとめて検索'}];
function searchVariants(input){let q=String(input||'').trim();const variants=[q];for(const a of shrineAliases){if(a.terms.some(t=>q.includes(t))){for(const t of a.terms){variants.push(q.replace(/江ノ島|江の島|江島|えのしま|エノシマ/g,t))}variants.push(a.canonical+'神社',a.canonical+'神社 神奈川県藤沢市')} }return [...new Set(variants.filter(Boolean))]}

function osmCandidate(x){const a=x.address||{};return {name:(x.namedetails?.['name:ja']||x.name||x.display_name?.split(',')[0]||'').trim(),address:lookupAddress(a),region:[a.state||a.province||'',a.city||a.town||a.village||a.county||''].filter(Boolean).join(' '),lat:Number(x.lat),lon:Number(x.lon),osmId:x.osm_type&&x.osm_id?x.osm_type+'/'+x.osm_id:'',wikidata:x.extratags?.wikidata||'',photoUrl:''}}
async function nominatimLookup(q,limit=30){const url='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&extratags=1&namedetails=1&countrycodes=jp&limit='+limit+'&dedupe=0&accept-language=ja&q='+encodeURIComponent(q);const r=await timedFetch(url,{headers:{Accept:'application/json'}},8500);if(!r.ok)throw Error('地図検索サービスが応答しません');return await r.json()}

async function nearbyShrines(point,radius=3000){const query=`[out:json][timeout:20];(nwr(around:${radius},${point.lat},${point.lon})["religion"="shinto"]["name"];nwr(around:${radius},${point.lat},${point.lon})["amenity"="place_of_worship"]["name"]["name"~"神社|神宮|八幡宮|稲荷|大社|江島"];);out center tags 90;`;
 const r=await timedFetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:query})},10000);if(!r.ok)throw Error('周辺検索サービスが混雑しています');const data=await r.json();return (data.elements||[]).map(x=>({name:x.tags?.['name:ja']||x.tags?.name||'',address:[x.tags?.['addr:province'],x.tags?.['addr:city'],x.tags?.['addr:suburb'],x.tags?.['addr:street'],x.tags?.['addr:housenumber']].filter(Boolean).join(' ')||'住所の詳細は地図で確認',region:[x.tags?.['addr:province'],x.tags?.['addr:city']].filter(Boolean).join(' ')||'地図で地域を確認',lat:Number(x.lat??x.center?.lat),lon:Number(x.lon??x.center?.lon),osmId:x.type+'/'+x.id,wikidata:x.tags?.wikidata||'',photoUrl:''})).filter(x=>x.name&&Number.isFinite(x.lat)&&Number.isFinite(x.lon))}

function renderLookupResults(results,info=''){

 const out=document.getElementById('lookupResults');if(!out)return;
 out.innerHTML=info+(results.length?`<p>${results.length}件の候補。住所と地図を確認して登録してください。</p>`+results.map(lookupCard).join(''):'<p>候補が見つかりませんでした。</p>')+'<button type="button" class="primary" style="background:#687c68" onclick="lookupMore()">⌕ 周辺の神社も探す（追加検索）</button>';

function uniqueLookup(items){const seen=new Set();return items.filter(x=>{const key=x.osmId||normalizeShrineName(x.name)+'@'+x.lat.toFixed(4)+','+x.lon.toFixed(4);if(seen.has(key))return false;seen.add(key);return true})}
async function lookupShrines(){
 const out=document.getElementById('lookupResults');const name=document.getElementById('lookupQuery').value.trim();const region=document.getElementById('lookupRegion').value.trim();
 if(!name&&!region){out.textContent='神社名または地域を入力してください';return}
 const cacheKey=name+'|'+region;if(lookupCache.has(cacheKey)){const cached=lookupCache.get(cacheKey);renderLookupResults(cached.results,cached.info+'<p>前回の検索結果を表示しています。</p>');return}

 try{
  let results=[],info='';
  if(looksLikePlace){
   const center=await findPlaceCenter([name,region].filter(Boolean).join(' '));
   if(!center)throw Error('地域が見つかりません');

}
async function lookupMore(){
 const out=document.getElementById('lookupResults');if(lookupBusy)return;

 }catch(e){if(seq===lookupSequence)note.textContent='周辺検索に失敗しました。時間をおいて試してください。'}finally{lookupBusy=false}
}
async function loadLookupPhotos(results){const ids=[...new Set(results.map(x=>x.wikidata).filter(x=>/^Q[0-9]+$/.test(x)))].slice(0,30);if(!ids.length)return;try{const url='https://www.wikidata.org/w/api.php?action=wbgetentities&ids='+encodeURIComponent(ids.join('|'))+'&props=claims&format=json&origin=*';const res=await fetch(url);if(!res.ok)return;const data=await res.json();for(let i=0;i<results.length;i++){const x=results[i];const claim=data.entities?.[x.wikidata]?.claims?.P18?.[0]?.mainsnak?.datavalue?.value;if(typeof claim!=='string')continue;const filename=claim.replace(/ /g,'_');const digest=await sha1Hex(filename);if(!digest)continue;const imageUrl='https://upload.wikimedia.org/wikipedia/commons/thumb/'+digest[0]+'/'+digest.slice(0,2)+'/'+encodeURIComponent(filename)+'/640px-'+encodeURIComponent(filename);x.photoUrl=imageUrl;const el=document.getElementById('lookupPhoto'+i);if(el&&window.lookupResults===results)el.innerHTML=`<img loading="lazy" src="${esc(imageUrl)}" alt="${esc(x.name)}に紐付く画像" onerror="this.remove();this.parentElement.querySelector('.lookup-caption').textContent='写真未確認'"><span class="lookup-caption">関連画像</span>`}}catch{}}
async function sha1Hex(s){if(!crypto.subtle)return '';const data=new TextEncoder().encode(s);const hash=await crypto.subtle.digest('SHA-1',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function addLookup(i,visited){const item=window.lookupResults?.[i];if(!item)return;const found=existingMatch(item);if(found){alert('この神社はすでに登録されています。参拝状況は一覧から変更できます。');return}const s={id:'lookup'+Date.now()+'_'+i,name:item.name,address:item.address,lat:item.lat,lon:item.lon,osmId:item.osmId,wikidata:item.wikidata,hours:'要確認',status:'御朱印授与も要確認',kind:'unknown',phone:'',visited:!!visited};shrines.push(s);save();render();const el=document.getElementById('lookupResults');if(el&&window.lookupResults)el.innerHTML='<p>追加しました。別の神社も検索できます。</p>'+window.lookupResults.map(lookupCard).join('');alert(s.name+' を'+(visited?'参拝済み':'行きたいリスト')+'に追加しました。')}
function searchForm(){return `<h2>近くの神社を探す</h2><p class="small">OpenStreetMapの登録データから神社を検索します。検索結果は御朱印・直書き対応を保証しません。追加後に必ず確認してください。</p><label class="field">検索の中心<input id="center" value="川崎市川崎区池上新町"></label><label class="field">検索半径<select id="radius"><option value="3000">3 km</option><option value="5000" selected>5 km</option><option value="10000">10 km</option><option value="20000">20 km</option></select></label><button class="primary" onclick="searchShrines()">検索する</button><div id="results" class="small"></div>`}async function searchShrines(){const out=document.getElementById('results');out.textContent='検索しています…';try{const place=document.getElementById('center').value;const radius=+document.getElementById('radius').value;const g=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(place))).json();if(!g.length)throw Error('中心地点が見つかりません');const lat=+g[0].lat,lon=+g[0].lon;const query=`[out:json][timeout:25];(nwr(around:${radius},${lat},${lon})["religion"="shinto"]["name"];);out center 100;`;const response=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:query})});if(!response.ok)throw Error('検索サービスが応答しません');const data=await response.json();const results=data.elements.map(x=>({name:x.tags?.['name:ja']||x.tags?.name,lat:x.lat||x.center?.lat,lon:x.lon||x.center?.lon})).filter(x=>x.name&&x.lat&&x.lon&&!shrines.some(s=>s.name===x.name)).sort((a,b)=>km({lat,lon},a)-km({lat,lon},b)).slice(0,35);window.searchResults=results;out.innerHTML=results.length?`<p>${results.length}件見つかりました（御朱印対応は未確認）</p>`+results.map((s,i)=>`<div class="result"><b>${esc(s.name)}</b><br>${km({lat,lon},s).toFixed(1)} km（直線）<div class="lookup-actions"><button onclick="addFound(${i},false)">＋ 行きたい</button><button onclick="addFound(${i},true)">✓ 参拝済み</button></div></div>`).join(''):'追加候補が見つかりませんでした'}catch(e){out.textContent='検索できませんでした。通信状況や検索サービスの混雑を確認してください。 '+e.message}}
function addFound(i,visited=false){const s=window.searchResults[i];if(!s)return;if(existingMatch(s)){alert("すでに登録済みです");return}shrines.push({id:"found"+Date.now()+"_"+i,name:s.name,address:s.name+"（住所未確認）",lat:s.lat,lon:s.lon,hours:"要確認",status:"御朱印授与も要確認",kind:"unknown",phone:"",visited:!!visited});save();render();alert(s.name+" を"+(visited?"参拝済み":"行きたいリスト")+"に追加しました。")}
