.actions a.call{background:#e8efe7;color:#244b38;border:1px solid #b9cdbb}.phone-note{font-size:11px;color:#77796e;margin-top:7px}.goshuin-filter{padding:0 18px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.goshuin-filter select{flex:1;min-width:130px;border:1px solid #d9d2c4;border-radius:10px;padding:11px;background:#fffdf8;color:var(--ink);font-size:13px}.source{font-size:11px;margin:8px 0;color:#6d7167}.source a{color:#426653}.photo img{cursor:pointer}.photo-large{width:100%;max-height:62vh;object-fit:contain;border-radius:12px}.kind{display:inline-block;margin:6px 0 0;padding:5px 8px;border-radius:5px;background:#eae8de;font-size:11px;color:#405347}</style></head><body><main class="app"><header class="hero"><div class="eyebrow">神社を訪ね、印を集める · v8</div><h1>御朱印めぐり <span style="font-size:18px">⛩</span></h1><p>次に訪ねたい神社が、きっと見つかる。</p></header><div class="stats"><div class="stat"><strong id="total">10</strong><span>登録神社</span></div><div class="stat"><strong id="done">0</strong><span>参拝済み</span></div><div class="stat"><strong id="left">10</strong><span>これから</span></div></div><div class="toolbar"><button class="pill active" id="allBtn" onclick="setFilter('all')">すべて</button><button class="pill" id="todoBtn" onclick="setFilter('todo')">未訪問</button><button class="pill" id="doneBtn" onclick="setFilter('done')">参拝済み</button><button class="pill" onclick="useGPS()">⌖ 現在地順</button><button class="pill" onclick="exportData()">↧ 記録を保存</button><button class="pill" onclick="document.getElementById('importFile').click()">↥ 復元</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div><div class="goshuin-filter"><label for="kindFilter" class="small">御朱印の種類</label><select id="kindFilter" onchange="setKindFilter(this.value)"><option value="all">すべて</option><option value="direct">直書き対応</option><option value="paper">書き置き対応</option><option value="both">両方対応</option><option value="unknown">未確認</option></select><label for="sortMode" class="small">並び順</label><select id="sortMode" onchange="setSortMode(this.value)"><option value="default">登録順</option><option value="near">現在地から近い順</option><option value="far">現在地から遠い順</option></select></div><section class="section"><div class="section-title"><h2>神社の一覧</h2><small id="sortLabel">登録順</small></div><div id="list"></div></section><div class="notice">※ 御朱印の種類は公開済みの資料に基づく参考情報で、当日の対応を保証しません。若宮八幡宮は京急電鉄2025年掲載情報を反映しています。現在地順は位置情報の許可が必要で、距離は直線距離です。御朱印の種類は案内文から判定できますが、公式サイトの自動巡回は行いません。判定は最新の授与状況を保証しません。受付時間も変更されることがあります。参拝前に公式情報をご確認ください。写真はWikipediaから取得できた場合のみ表示します。</div><nav class="bottom"><button class="secondary" onclick="openModal('add')">＋ 手動で追加</button><button onclick="openModal('search')">⌕ 範囲を広げて探す</button></nav></main>

<script>
const defaults=[

['金山神社','神奈川県川崎市川崎区大師駅前2-13-16','要確認','直書き未確認','金山神社 (川崎市)'],
['稲毛神社','神奈川県川崎市川崎区宮本町7-7','9:00〜17:00','直書き情報は要確認','稲毛神社'],
['六郷神社','東京都大田区東六郷3-10-18','要確認','直書き未確認','六郷神社'],

['穴守稲荷神社','東京都大田区羽田5-2-7','8:30〜17:00','直書き情報は要確認','穴守稲荷神社'],
['蒲田八幡神社','東京都大田区蒲田4-18-18','10:00〜15:00（参考）','直書き情報は要確認','蒲田八幡神社'],
['鶴見神社','神奈川県横浜市鶴見区鶴見中央1-14-1','要確認','直書き未確認','鶴見神社'],

['大師稲荷神社','神奈川県川崎市川崎区中瀬3-5-12','要確認','御朱印授与も要確認','大師稲荷神社']
].map((a,i)=>({id:'base'+i,name:a[0],address:a[1],hours:a[2],status:a[3],wiki:a[4],visited:false}));
// Verified contact numbers; never overwrite user-edited phone numbers.
const verified={base0:{phone:'044-222-3206',phoneSource:'https://www.kanagawa-jinja.or.jp/shrine/1201005-000/'},base2:{phone:'044-222-4554',phoneSource:'https://www.takemikatsuchi.net/toiawase_f/'},base5:{phone:'03-3741-0809',phoneSource:'https://www.anamori.jp/inquiry.html'}};
// Versioned reference information, checked against Keikyu's published 2025 shrine guide.
// Historical guide information is not a guarantee of same-day availability.
const referenceKinds={
 base0:{kind:'both',kindSource:'https://www.keikyu.co.jp/cp/natsumode2025/',kindNote:'京急電鉄2025年の案内：直書き・書き置き両方。イラスト御朱印の直書きは土日祝日限定。訪問前に要確認。',kindChecked:'2025年の掲載情報',referenceVersion:6}
};
const key='goshuin-meguri-v1';
let shrines;try{const stored=JSON.parse(localStorage.getItem(key));shrines=Array.isArray(stored)?stored:defaults}catch{shrines=defaults}
// v7: Reconcile legacy records by canonical shrine identity, not just old IDs.
// Preserve visits, user additions, phone edits and other personal data.
function shrineIdentity(s){
 const name=String(s.name||'').normalize('NFKC').replace(/[\s　]/g,'');
 const address=String(s.address||'').normalize('NFKC').replace(/[\s　－ー−‐]/g,'-');
 return {name,address};
}
function canonicalId(s){
 if(defaults.some(d=>d.id===s.id))return s.id;
 const x=shrineIdentity(s);
 const candidates=defaults.filter(d=>shrineIdentity(d).name===x.name);
 if(candidates.length!==1)return null;
 // Avoid assigning a common shrine name to an unrelated location.
 const a=shrineIdentity(candidates[0]).address;
 if(!x.address||!a||x.address===a||x.address.includes(a)||a.includes(x.address))return candidates[0].id;
 return null;
}
function migrateShrines(items){
 const existing=Array.isArray(items)?items.filter(x=>x&&typeof x==='object'):[];
 const seen=new Set();
 const migrated=existing.map(original=>{
  const s={...original};const id=canonicalId(s);
  if(id){seen.add(id);s.id=id;}
  const v=verified[id||s.id];
  if(v){if(!s.phone)s.phone=v.phone;if(!s.phoneSource)s.phoneSource=v.phoneSource;}
  const ref=referenceKinds[id||s.id];
  const valid=['direct','paper','both','unknown'].includes(s.kind);
  // The reference wins over legacy 'unknown' and any earlier automatic classification.
  // A deliberate user classification remains unchanged unless it was marked as automatic.
  const legacyUnknown=!valid||s.kind==='unknown';
  const oldReference=Number(s.referenceVersion||0)>0&&Number(s.referenceVersion||0)<ref?.referenceVersion;
  if(ref&&(legacyUnknown||oldReference)){
   s.kind=ref.kind;s.kindSource=ref.kindSource;s.kindNote=ref.kindNote;
   s.kindChecked=ref.kindChecked;s.referenceVersion=ref.referenceVersion;
   s.status='掲載資料では直書き・書き置き両方（当日要確認）';
  }else if(!valid)s.kind='unknown';
  if(s.kind==='unknown'&&/直書き案内あり|手書き案内あり|期間限定の直書き実績/.test(s.status||''))s.status='御朱印の種類は要確認';
  return s;
 });
 // Repair missing built-in entries without erasing any custom shrines.
 for(const d of defaults){if(!seen.has(d.id))migrated.push({...d});}

}
shrines=migrateShrines(shrines);
let filter='all',kindFilter='all',sortMode='default',locationPoint=null,images={};const save=()=>localStorage.setItem(key,JSON.stringify(shrines));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const maps=(s,dir=false)=>'https://www.google.com/maps/'+(dir?'dir/?api=1&destination=':'search/?api=1&query=')+encodeURIComponent(s.address||s.name);const photos=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' '+s.address);function km(a,b){const r=Math.PI/180,dlat=(a.lat-b.lat)*r,dlon=(a.lon-b.lon)*r,x=Math.sin(dlat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dlon/2)**2;return 12742*Math.asin(Math.sqrt(x))}function ordered(){const baseIndex=s=>{const i=defaults.findIndex(x=>x.id===s.id);return i<0?1000:i};return [...shrines].sort((a,b)=>{if(sortMode==='default'||!locationPoint)return baseIndex(a)-baseIndex(b);const da=Number.isFinite(a.lat)&&Number.isFinite(a.lon)?km(locationPoint,a):Infinity,db=Number.isFinite(b.lat)&&Number.isFinite(b.lon)?km(locationPoint,b):Infinity;const knownA=Number.isFinite(da),knownB=Number.isFinite(db);if(knownA!==knownB)return knownA?-1:1;if(!knownA)return baseIndex(a)-baseIndex(b);return (sortMode==='far'?db-da:da-db)||baseIndex(a)-baseIndex(b)})}function setKindFilter(v){kindFilter=v;render()}function setSortMode(v){sortMode=v;if(v==='default'){document.getElementById('sortLabel').textContent='登録順';render();return}if(!locationPoint){useGPS();return}document.getElementById('sortLabel').textContent=v==='far'?'現在地から遠い順':'現在地から近い順';render();loadMissingCoordinates()}

// A source excerpt can be classified locally. A URL alone is not proof of current service.
function classifyExcerpt(raw){
 const t=String(raw||'').replace(/\s+/g,'');
 if(!t)return {kind:'unknown',reason:'案内文がありません'};
 const direct=/(直書き|直接記帳|御朱印帳に(?:直接|お書き)|御朱印帳へ(?:直接|お書き)|帳面に(?:直接|お書き))/.test(t);
 const paper=/(書き置き|書置き|紙で(?:の)?(?:お渡し|授与)|紙朱印)/.test(t);
 const directNo=/(直書き(?:は|を)?(?:休止|中止|不可|対応しておりません|行っておりません)|記帳(?:は|を)?(?:休止|中止|不可))/.test(t);
 const paperOnly=/(書き置きのみ|書置きのみ|書き置きでの(?:み|対応)|書置きでの(?:み|対応))/.test(t);
 const paperNo=/(書き置き(?:は|を)?(?:休止|中止|不可|対応しておりません))/.test(t);
 if(paperOnly||directNo&&paper&&!paperNo)return {kind:'paper',reason:'書き置きの案内を検出'};
 if(directNo)return {kind:'unknown',reason:'直書き休止の記載があり、書き置き対応は確認できません'};
 if(direct&&paper&&!paperNo)return {kind:'both',reason:'両方の案内を検出'};
 if(direct&&!paperOnly)return {kind:'direct',reason:'直書きの案内を検出（書き置きの有無は未確認）'};
 if(paper&&!paperNo)return {kind:'paper',reason:'書き置きの案内を検出（直書きの有無は未確認）'};
 return {kind:'unknown',reason:'種類を特定できません'};
}
function autoClassifyFromForm(){
 const form=document.querySelector('#modalBody form');if(!form)return;
 const excerpt=form.elements.namedItem('sourceExcerpt')?.value||'';
 const result=classifyExcerpt(excerpt);
 form.elements.namedItem('kind').value=result.kind;
 const el=document.getElementById('classifyResult');if(el)el.textContent='読み取り結果：'+result.reason+'。現在の授与状況は必ず公式情報で確認してください。';
}

function render(){document.getElementById('total').textContent=shrines.length;const d=shrines.filter(x=>x.visited).length;document.getElementById('done').textContent=d;document.getElementById('left').textContent=shrines.length-d;['all','todo','done'].forEach(k=>document.getElementById(k+'Btn').classList.toggle('active',filter===k));let data=ordered().filter(s=>filter==='all'||(filter==='done'?s.visited:!s.visited)).filter(s=>kindFilter==='all'||(kindFilter==='direct'?['direct','both'].includes(s.kind):kindFilter==='paper'?['paper','both'].includes(s.kind):s.kind===kindFilter));document.getElementById('list').innerHTML=data.length?data.map((s,i)=>`<article class="shrine ${s.visited?'visited':''}"><div class="photo">${images[s.id]?`<img loading="lazy" src="${esc(images[s.id])}" alt="${esc(s.name)}の写真">`:'<span class="placeholder">⛩</span>'}<span class="num">${String(i+1).padStart(2,'0')}</span><button class="photoLink" onclick="openPhotos('${s.id}')">写真を見る ↗</button></div><div class="content"><div class="nameRow"><div><div class="name">${esc(s.name)}</div><div class="address">${esc(s.address)}</div><div class="kind">${esc(({direct:'直書き対応',paper:'書き置き対応',both:'直書き・書き置き両方',unknown:'御朱印の種類：未確認'})[s.kind]||'御朱印の種類：未確認')}</div><br><span class="tag">${esc(s.kind==='unknown'?'直書き・書き置き：要確認':s.status||'御朱印情報あり')}</span>${s.kindNote?`<div class="source">${esc(s.kindNote)}</div>`:''}${s.kindSource?`<div class="source">御朱印情報：<a href="${esc(s.kindSource)}" target="_blank" rel="noopener">参照元 ↗</a></div>`:''}</div><label class="visit"><input type="checkbox" ${s.visited?'checked':''} onchange="toggle('${s.id}',this.checked)">参拝済</label></div>${s.phoneSource?`<div class="source">☎ ${esc(s.phone||'')} · <a href="${esc(s.phoneSource)}" target="_blank" rel="noopener">電話番号の情報元 ↗</a></div>`:''}<div class="details"><span>🕘 ${esc(s.hours)}</span><span>${locationPoint&&Number.isFinite(s.lat)&&Number.isFinite(s.lon)?km(locationPoint,s).toFixed(1)+' km（直線）':'距離未計測'}</span></div><div class="actions"><a target="_blank" rel="noopener" href="${maps(s)}">地図</a><a class="go" target="_blank" rel="noopener" href="${maps(s,true)}">➤ 道案内</a>${s.phone&&/^\+?[0-9()\s-]{6,22}$/.test(s.phone)?`<a class="call" href="tel:${esc(s.phone.replace(/[^+0-9]/g,''))}">☎ 電話する</a>`:`<button onclick="editShrine('${s.id}')">☎ 番号を登録</button>`}<button onclick="editShrine('${s.id}')">編集</button></div></div></article>`).join(''):'<div class="empty">該当する神社はありません</div>';data.forEach(s=>loadPhoto(s))}function openPhotos(id){const s=shrines.find(x=>x.id===id);if(!s)return;const img=images[id];if(img){document.getElementById('modal').classList.add('open');document.getElementById('modalBody').innerHTML=`<h2>${esc(s.name)}の写真</h2><img class="photo-large" src="${esc(img)}" alt="${esc(s.name)}"><p class="small">Wikipediaから取得した画像です。写真がない場合や他の写真を見る場合は地図を開いてください。</p><a href="${photos(s)}" target="_blank" rel="noopener">Googleマップで写真を探す ↗</a>`}else window.open(photos(s),'_blank','noopener')}function toggle(id,v){let s=shrines.find(x=>x.id===id);if(s){s.visited=v;save();render()}}function setFilter(v){filter=v;render()}function openModal(type){document.getElementById('modal').classList.add('open');document.getElementById('modalBody').innerHTML=type==='add'?addForm():searchForm()}function closeModal(){document.getElementById('modal').classList.remove('open')}function addForm(s={}){return `<h2>${s.id?'神社を編集':'神社を追加'}</h2><form onsubmit="submitShrine(event,'${s.id||''}')"><label class="field">神社名<input name="name" required value="${esc(s.name||'')}"></label><label class="field">住所<input name="address" required value="${esc(s.address||'')}"></label><label class="field">電話番号（確認済みの番号を入力）<input name="phone" type="tel" inputmode="tel" placeholder="例：0441234567" value="${esc(s.phone||'')}"></label><label class="field">御朱印受付時間<input name="hours" value="${esc(s.hours||'要確認')}"></label><label class="field">御朱印の種類（公式情報や電話で確認して選択）<select name="kind">${[['unknown','未確認'],['direct','直書き対応'],['paper','書き置き対応'],['both','両方対応']].map(([v,label])=>`<option value="${v}" ${s.kind===v?'selected':''}>${label}</option>`).join('')}</select></label><label class="field">御朱印情報の出典URL<input name="kindSource" type="url" placeholder="https://..." value="${esc(s.kindSource||'')}"></label><label class="field">公式サイト等の御朱印案内文（コピーして貼り付け）<input name="sourceExcerpt" placeholder="例：御朱印帳への直書き、書き置きも対応" value="${esc(s.sourceExcerpt||'')}"></label><button type="button" class="primary" style="background:#687c68" onclick="autoClassifyFromForm()">案内文から種類を読み取る</button><p id="classifyResult" class="small">案内文を貼り付けると、種類を自動で選択します。内容が曖昧なら未確認にします。</p><label class="field">直書き情報<select name="status">${['御朱印の種類は要確認','直書き情報は要確認','直書き未確認','直書き案内あり','手書き案内あり','期間限定の直書き実績','御朱印授与も要確認'].map(v=>`<option ${s.status===v?'selected':''}>${v}</option>`).join('')}</select></label><button class="primary">保存する</button>${s.id&&!s.id.startsWith('base')?`<button type="button" class="primary" style="background:#aa5547" onclick="removeShrine('${s.id}')">削除</button>`:''}</form>`}function editShrine(id){const s=shrines.find(x=>x.id===id);if(s){openModal('add');document.getElementById('modalBody').innerHTML=addForm(s)}}function submitShrine(e,id){e.preventDefault();const f=new FormData(e.target),s={id:id||'custom'+Date.now(),name:f.get('name').trim(),address:f.get('address').trim(),hours:f.get('hours'),phone:String(f.get('phone')||'').trim(),kind:f.get('kind'),kindSource:/^https?:\/\//i.test(String(f.get('kindSource')||'').trim())?String(f.get('kindSource')).trim():'',sourceExcerpt:String(f.get('sourceExcerpt')||'').trim(),status:f.get('status'),phoneSource:shrines.find(x=>x.id===id)?.phoneSource||'',visited:shrines.find(x=>x.id===id)?.visited||false};if(s.sourceExcerpt){const classified=classifyExcerpt(s.sourceExcerpt);s.kind=classified.kind;s.status=classified.kind==='unknown'?'御朱印の種類は要確認':'案内文から分類（最新状況は要確認）'}if(id){Object.assign(shrines.find(x=>x.id===id),s)}else shrines.push(s);save();closeModal();render();geocode(s)}function removeShrine(id){if(confirm('この神社を削除しますか？')){shrines=shrines.filter(s=>s.id!==id);save();closeModal();render()}}
async function loadPhoto(s){if(images[s.id]!==undefined||!s.wiki)return;images[s.id]='';try{const url='https://ja.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=900&titles='+encodeURIComponent(s.wiki)+'&origin=*';const j=await(await fetch(url)).json();const p=Object.values(j.query.pages)[0];if(p.thumbnail?.source){images[s.id]=p.thumbnail.source;render()}}catch{}}
async function geocode(s){if(Number.isFinite(s.lat)&&Number.isFinite(s.lon))return true;try{const q=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q='+encodeURIComponent(s.address),{headers:{'Accept':'application/json'}});if(!q.ok)return false;const j=await q.json();if(j[0]&&Number.isFinite(+j[0].lat)&&Number.isFinite(+j[0].lon)){s.lat=+j[0].lat;s.lon=+j[0].lon;save();return true}}catch{}return false}
let geocoding=false;
async function loadMissingCoordinates(){if(geocoding||!locationPoint)return;geocoding=true;const missing=shrines.filter(s=>!Number.isFinite(s.lat)||!Number.isFinite(s.lon));let done=0;for(const s of missing){document.getElementById('sortLabel').textContent=`住所を確認中 ${done+1}/${missing.length}`;await geocode(s);done++;render();if(done<missing.length)await new Promise(resolve=>setTimeout(resolve,1200))}geocoding=false;const known=shrines.filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lon)).length;document.getElementById('sortLabel').textContent=`${sortMode==='far'?'遠い順':'近い順'}・距離計測 ${known}/${shrines.length}件`;render()}
function useGPS(){if(sortMode==='default')sortMode='near';document.getElementById('sortMode').value=sortMode;if(!navigator.geolocation){alert('この環境では位置情報を利用できません');return}document.getElementById('sortLabel').textContent='現在地を取得中…';navigator.geolocation.getCurrentPosition(p=>{locationPoint={lat:p.coords.latitude,lon:p.coords.longitude};document.getElementById('sortLabel').textContent='現在地を取得しました・距離を計算中';render();loadMissingCoordinates()},err=>{sortMode='default';document.getElementById('sortMode').value='default';document.getElementById('sortLabel').textContent='登録順';const msg=err.code===1?'位置情報が許可されていません。iPhoneの設定でSafariまたはホーム画面アプリの位置情報を許可してください。':err.code===3?'位置情報の取得が時間切れになりました。屋外などで再試行してください。':'位置情報を取得できませんでした。';alert(msg);render()},{enableHighAccuracy:false,maximumAge:60000,timeout:20000})}
function exportData(){const blob=new Blob([JSON.stringify({version:1,shrines},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='goshuin-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.shrines)||obj.shrines.length>2000||!obj.shrines.every(x=>typeof x.name==='string'&&typeof x.address==='string'))throw Error('形式が違います');if(!confirm('現在の参拝記録をバックアップの内容に置き換えますか？'))return;shrines=migrateShrines(obj.shrines);save();render();alert('復元しました')}catch{alert('読み込めませんでした。正しいバックアップを選んでください')}finally{e.target.value=''}}function searchForm(){return `<h2>近くの神社を探す</h2><p class="small">OpenStreetMapの登録データから神社を検索します。検索結果は御朱印・直書き対応を保証しません。追加後に必ず確認してください。</p><label class="field">検索の中心<input id="center" value="川崎市川崎区池上新町"></label><label class="field">検索半径<select id="radius"><option value="3000">3 km</option><option value="5000" selected>5 km</option><option value="10000">10 km</option><option value="20000">20 km</option></select></label><button class="primary" onclick="searchShrines()">検索する</button><div id="results" class="small"></div>`}async function searchShrines(){const out=document.getElementById('results');out.textContent='検索しています…';try{const place=document.getElementById('center').value;const radius=+document.getElementById('radius').value;const g=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(place))).json();if(!g.length)throw Error('中心地点が見つかりません');const lat=+g[0].lat,lon=+g[0].lon;const query=`[out:json][timeout:25];(nwr(around:${radius},${lat},${lon})["religion"="shinto"]["name"];);out center 100;`;const response=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:query})});if(!response.ok)throw Error('検索サービスが応答しません');const data=await response.json();const results=data.elements.map(x=>({name:x.tags?.['name:ja']||x.tags?.name,lat:x.lat||x.center?.lat,lon:x.lon||x.center?.lon})).filter(x=>x.name&&x.lat&&x.lon&&!shrines.some(s=>s.name===x.name)).sort((a,b)=>km({lat,lon},a)-km({lat,lon},b)).slice(0,35);window.searchResults=results;out.innerHTML=results.length?`<p>${results.length}件見つかりました（御朱印対応は未確認）</p>`+results.map((s,i)=>`<div class="result"><button onclick="addFound(${i})">追加</button><b>${esc(s.name)}</b><br>${km({lat,lon},s).toFixed(1)} km（直線）</div>`).join(''):'追加候補が見つかりませんでした'}catch(e){out.textContent='検索できませんでした。通信状況や検索サービスの混雑を確認してください。 '+e.message}}
function addFound(i){const s=window.searchResults[i];if(!s)return;shrines.push({id:'found'+Date.now(),name:s.name,address:s.name+'（住所未確認）',lat:s.lat,lon:s.lon,hours:'要確認',status:'御朱印授与も要確認',kind:'unknown',phone:'',visited:false});save();render();alert(s.name+' を追加しました。御朱印対応は未確認です。')}
